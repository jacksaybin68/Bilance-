version: 2
updates:
  - package-ecosystem: npm
    directory: /okbong-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /okbong-admin-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      admin-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /okbong-user-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      user-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
