version: '3.9'

services:
  api:
    build:
      # docker/backend.Dockerfile copies from the repo root (okbong-backend/ and
      # okbong-admin-frontend/), so the build context must be the repo root.
      context: ..
      dockerfile: okbong-backend/docker/backend.Dockerfile
      target: runtime
    ports:
      - '3001:3001'
    env_file:
      - .env.local
    # Overrides .env.local. Two of these are load-bearing:
    #  - POSTGRES_HOST must NOT be "localhost": app.module.ts only selects the
    #    Postgres driver when this is set to something else, and Keploy can only
    #    record/mock a database it can observe on the network (in-memory SQLite
    #    is invisible to it, which would leave replay data-less).
    #  - NODE_ENV must stay "development" so TypeORM `synchronize` creates the
    #    schema; there are no migrations, so "production" leaves the DB empty.
    environment:
      PORT: '3001'
      NODE_ENV: development
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - okbong

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-okbong}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-okbong}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - okbong

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - okbong

volumes:
  pgdata:
  redisdata:

networks:
  okbong:
    name: okbong-network
